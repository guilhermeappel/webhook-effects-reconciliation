name: Idea or improvement
description: Suggest an improvement, a new failure case for the tests, or a clarification of the docs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: The situation or gap, before the solution. For a new failure case, describe how an integration silently loses or corrupts an effect.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would change
      description: A concrete proposal. If it changes a rule of `ChargeRules.Decide` or a listing of the article, say which and why it no longer holds.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why you would not pick them.
