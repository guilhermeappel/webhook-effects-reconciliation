name: Bug report
description: Something behaves differently from what the code, the README or the article says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use this form: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead. Point to the README or the article if it says otherwise.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands and steps, from a clean checkout.
      placeholder: |
        1. docker compose up -d
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, .NET SDK (`dotnet --version`), and the commit you are on.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or test output
      description: Relevant logs or the failing test output.
      render: text
