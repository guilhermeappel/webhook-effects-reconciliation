name: webhook-inbox

# The image tag is the one the tests start (tests/WebhookInbox.Tests/Fixtures/TestImages.cs). Keep them in sync.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # set POSTGRES_PORT if 5432 is taken on your machine
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
